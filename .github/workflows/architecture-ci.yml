name: Architecture CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-conformance:
    name: Quality and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check conformance_platform tests

      - name: Run tests
        run: python -m pytest -v

      - name: Run architecture conformance scan
        run: |
          python -m conformance_platform.cli \
            --output reports/conformance-report.json

      - name: Display conformance report
        if: always()
        run: |
          if [ -f reports/conformance-report.json ]; then
            cat reports/conformance-report.json
          else
            echo "Conformance report was not generated."
          fi