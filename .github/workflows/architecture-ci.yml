name: Architecture CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-conformance:
    name: Backend quality and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check conformance_platform tests

      - name: Run backend tests
        run: python -m pytest -v

      - name: Run architecture conformance scan
        run: |
          python -m conformance_platform.cli \
            --output reports/conformance-report.json

      - name: Display conformance report
        if: always()
        run: |
          if [ -f reports/conformance-report.json ]; then
            cat reports/conformance-report.json
          else
            echo "Conformance report was not generated."
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-conformance-report
          path: reports/conformance-report.json
          if-no-files-found: warn
          retention-days: 14

  dashboard-quality:
    name: Dashboard quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build